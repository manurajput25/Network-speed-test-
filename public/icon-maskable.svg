<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="mBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="70%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="mArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mNeedleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#mBgGrad)"/>

  <!-- Centered safe zone content (scaled to 75% so Android cropping never clips edges) -->
  <g transform="translate(64, 64) scale(0.75)">
    <circle cx="256" cy="256" r="230" fill="none" stroke="#1e293b" stroke-width="4"/>
    <circle cx="256" cy="256" r="214" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6 10" opacity="0.4"/>

    <!-- Gauge Arc Background Track -->
    <path d="M 128 384 A 180 180 0 1 1 384 384" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round"/>

    <!-- Active Neon Speed Arc -->
    <path d="M 128 384 A 180 180 0 1 1 360 170" fill="none" stroke="url(#mArcGrad)" stroke-width="28" stroke-linecap="round" filter="url(#mGlow)"/>

    <!-- Speedometer Needle -->
    <g transform="rotate(45 256 256)">
      <polygon points="256,90 264,256 248,256" fill="url(#mNeedleGrad)" filter="url(#mGlow)"/>
      <line x1="256" y1="100" x2="256" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Center Metallic Hub -->
    <circle cx="256" cy="256" r="36" fill="#070c18" stroke="#334155" stroke-width="4"/>
    <circle cx="256" cy="256" r="20" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#mGlow)"/>
    <circle cx="256" cy="256" r="8" fill="#ffffff"/>

    <path d="M 256 340 L 268 368 L 254 368 L 262 396 L 244 362 L 256 362 Z" fill="#00f0ff" filter="url(#mGlow)"/>
    <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="#ffffff" text-anchor="middle">VELOCITYNET</text>
  </g>
</svg>
